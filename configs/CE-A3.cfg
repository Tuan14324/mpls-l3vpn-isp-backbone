enable
configure terminal
hostname CE-A3
ip cef
!
interface Loopback10
 description CUSTOMER-A-SITE3-LAN
 ip address 192.168.30.1 255.255.255.0
!
interface Ethernet0/0
 description TO-PE3
 ip address 172.16.13.2 255.255.255.252
 no shutdown
!
router bgp 65113
 bgp router-id 192.168.30.1
 neighbor 172.16.13.1 remote-as 65000
 !
 address-family ipv4
  network 192.168.30.0 mask 255.255.255.0
  neighbor 172.16.13.1 activate
 exit-address-family
!
end
write memory
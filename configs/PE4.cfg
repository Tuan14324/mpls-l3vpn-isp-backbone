enable
configure terminal
hostname PE4
ip cef
!
ip vrf CUST-B
 rd 65000:204
 route-target export 65000:200
 route-target import 65000:200
!
interface Loopback0
 ip address 10.255.0.4 255.255.255.255
 ip router isis CORE
!
interface Ethernet0/3
 description BACKBONE-TO-P1
 ip address 10.0.45.1 255.255.255.252
 ip router isis CORE
 isis network point-to-point
 mpls ip
 no shutdown
!
interface Ethernet0/2
 description BACKBONE-TO-P2
 ip address 10.0.46.1 255.255.255.252
 ip router isis CORE
 isis network point-to-point
 mpls ip
 no shutdown
!
interface Ethernet0/0
 description CUSTOMER-B-CE-B2
 ip vrf forwarding CUST-B
 ip address 172.16.22.1 255.255.255.252
 ip ospf 20 area 0
 ip ospf network point-to-point
 no shutdown
!
router isis CORE
 net 49.0001.0000.0000.0004.00
 is-type level-2-only
 metric-style wide
 passive-interface Loopback0
!
mpls ldp router-id Loopback0 force
!
router ospf 20 vrf CUST-B
 router-id 10.255.0.4
 redistribute bgp 65000 subnets
!
router bgp 65000
 bgp router-id 10.255.0.4
 no bgp default ipv4-unicast
 neighbor 10.255.0.7 remote-as 65000
 neighbor 10.255.0.7 update-source Loopback0
 neighbor 10.255.0.8 remote-as 65000
 neighbor 10.255.0.8 update-source Loopback0
 !
 address-family vpnv4
  neighbor 10.255.0.7 activate
  neighbor 10.255.0.7 send-community extended
  neighbor 10.255.0.8 activate
  neighbor 10.255.0.8 send-community extended
 exit-address-family
 !
 address-family ipv4 vrf CUST-B
  redistribute ospf 20 match internal external 1 external 2
 exit-address-family
end
write memory


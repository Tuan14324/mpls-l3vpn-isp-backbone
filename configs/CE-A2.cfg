enable
configure terminal
hostname CE-A2
ip cef
!
interface Loopback10
 description CUSTOMER-A-SITE2-LAN
 ip address 192.168.20.1 255.255.255.0
!
interface Ethernet0/0
 description TO-PE2
 ip address 172.16.12.2 255.255.255.252
 no shutdown
!
router bgp 65112
 bgp router-id 192.168.20.1
 neighbor 172.16.12.1 remote-as 65000
 !
 address-family ipv4
  network 192.168.20.0 mask 255.255.255.0
  neighbor 172.16.12.1 activate
 exit-address-family
!
end
write memory


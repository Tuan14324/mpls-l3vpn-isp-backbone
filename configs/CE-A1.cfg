enable
configure terminal
hostname CE-A1
ip cef
!
interface Loopback10
 description CUSTOMER-A-LAN-SITE1
 ip address 192.168.10.1 255.255.255.0
!
interface Ethernet0/0
 description TO-PE1
 ip address 172.16.11.2 255.255.255.252
 no shutdown
!
router bgp 65111
 bgp router-id 192.168.10.1
 neighbor 172.16.11.1 remote-as 65000
 !
 address-family ipv4
  network 192.168.10.0 mask 255.255.255.0
  neighbor 172.16.11.1 activate
 exit-address-family
end
write memory


enable
configure terminal
hostname PE2
ip cef
!
ip vrf CUST-A
 rd 65000:102
 route-target export 65000:100
 route-target import 65000:100
!
interface Loopback0
 ip address 10.255.0.2 255.255.255.255
 ip router isis CORE
!
interface Ethernet0/1
 description BACKBONE-TO-P1
 ip address 10.0.25.1 255.255.255.252
 ip router isis CORE
 isis network point-to-point
 mpls ip
 no shutdown
!
interface Ethernet0/2
 description BACKBONE-TO-P2
 ip address 10.0.26.1 255.255.255.252
 ip router isis CORE
 isis network point-to-point
 mpls ip
 no shutdown
!
interface Ethernet0/0
 description CUSTOMER-A-CE-A2
 ip vrf forwarding CUST-A
 ip address 172.16.12.1 255.255.255.252
 no shutdown
!
router isis CORE
 net 49.0001.0000.0000.0002.00
 is-type level-2-only
 metric-style wide
 passive-interface Loopback0
!
mpls ldp router-id Loopback0 force
!
router bgp 65000
 bgp router-id 10.255.0.2
 no bgp default ipv4-unicast
 neighbor 10.255.0.7 remote-as 65000
 neighbor 10.255.0.7 update-source Loopback0
 neighbor 10.255.0.8 remote-as 65000
 neighbor 10.255.0.8 update-source Loopback0
 !
 address-family vpnv4
  neighbor 10.255.0.7 activate
  neighbor 10.255.0.7 send-community extended
  neighbor 10.255.0.8 activate
  neighbor 10.255.0.8 send-community extended
 exit-address-family
 !
 address-family ipv4 vrf CUST-A
  neighbor 172.16.12.2 remote-as 65112
  neighbor 172.16.12.2 activate
 exit-address-family
!
end
write memory


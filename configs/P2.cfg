 ip router isis CORE
 isis network point-to-point
 mpls ip
 no shutdown
!
interface Ethernet1/0
 description TO-PE3
 ip address 10.0.36.2 255.255.255.252
 ip router isis CORE
 isis network point-to-point
 mpls ip
 no shutdown
!
interface Ethernet1/1
 description TO-PE4
 ip address 10.0.46.2 255.255.255.252
 ip router isis CORE
 isis network point-to-point
 mpls ip
 no shutdown
!
interface Ethernet0/0
 description TO-P1

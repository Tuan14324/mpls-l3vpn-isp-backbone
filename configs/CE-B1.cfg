enable
configure terminal
hostname CE-B1
ip cef
!
interface Loopback10
 description CUSTOMER-B-LAN-SITE1
 ip address 192.168.10.1 255.255.255.0
 ip ospf 20 area 0
 ip ospf network point-to-point
!
interface Ethernet0/0
 description TO-PE1
 ip address 172.16.21.2 255.255.255.252
 ip ospf 20 area 0
 ip ospf network point-to-point
 no shutdown
!
router ospf 20
 router-id 192.168.10.1
 passive-interface Loopback10
end
write memory

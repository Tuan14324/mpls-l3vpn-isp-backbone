 mpls ip
 no shutdown
!
interface Ethernet1/1
 description TO-PE2
 ip address 10.0.25.2 255.255.255.252
 ip router isis CORE
 isis network point-to-point
 mpls ip
 no shutdown
!
interface Ethernet0/2
 description TO-PE3
 ip address 10.0.35.2 255.255.255.252
 ip router isis CORE
 isis network point-to-point
 mpls ip
 no shutdown
!
interface Ethernet0/3
 description TO-PE4
 ip address 10.0.45.2 255.255.255.252
 ip router isis CORE
 isis network point-to-point
 mpls ip
 no shutdown
!
interface Ethernet0/0
 description TO-P2
 ip address 10.0.56.1 255.255.255.252
 ip router isis CORE

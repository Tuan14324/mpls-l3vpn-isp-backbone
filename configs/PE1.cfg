enable
configure terminal
hostname PE1
ip cef
!
ip vrf CUST-A
 rd 65000:101
 route-target export 65000:100
 route-target import 65000:100
!
ip vrf CUST-B
 rd 65000:201
 route-target export 65000:200
 route-target import 65000:200
!
interface Loopback0
 ip address 10.255.0.1 255.255.255.255
 ip router isis CORE
!
interface Ethernet0/3
 description BACKBONE-TO-P1
 ip address 10.0.15.1 255.255.255.252
 ip router isis CORE
 isis network point-to-point
 mpls ip
 no shutdown
!
interface Ethernet0/1
 description BACKBONE-TO-P2
 ip address 10.0.16.1 255.255.255.252
 ip router isis CORE
 isis network point-to-point
 mpls ip
 no shutdown
!
interface Ethernet0/0
 description CUSTOMER-A-CE-A1
 ip vrf forwarding CUST-A
 ip address 172.16.11.1 255.255.255.252
 no shutdown
!
interface Ethernet0/2
 description CUSTOMER-B-CE-B1
 ip vrf forwarding CUST-B
 ip address 172.16.21.1 255.255.255.252
 ip ospf 20 area 0
 ip ospf network point-to-point
 no shutdown
!
router isis CORE
 net 49.0001.0000.0000.0001.00
 is-type level-2-only
 metric-style wide
 passive-interface Loopback0
!
mpls ldp router-id Loopback0 force
!
router ospf 20 vrf CUST-B
 router-id 10.255.0.1
 redistribute bgp 65000 subnets
!
router bgp 65000
 bgp router-id 10.255.0.1
 no bgp default ipv4-unicast
 neighbor 10.255.0.7 remote-as 65000
 neighbor 10.255.0.7 update-source Loopback0
 neighbor 10.255.0.8 remote-as 65000
 neighbor 10.255.0.8 update-source Loopback0
 !
 address-family vpnv4
  neighbor 10.255.0.7 activate
  neighbor 10.255.0.7 send-community extended
  neighbor 10.255.0.8 activate
  neighbor 10.255.0.8 send-community extended
 exit-address-family
 !
 address-family ipv4 vrf CUST-A
  neighbor 172.16.11.2 remote-as 65111
  neighbor 172.16.11.2 activate
 exit-address-family
 !
 address-family ipv4 vrf CUST-B
  redistribute ospf 20 match internal external 1 external 2
 exit-address-family
end
write memory
